server {
    listen 80;
    server_name careeraltas.com www.careeraltas.com;

    return 301 https://careeraltas.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name careeraltas.com www.careeraltas.com;

    ssl_certificate /www/server/panel/vhost/cert/careeraltas.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/careeraltas.com/privkey.pem;

    access_log /www/wwwlogs/careeraltas.com.log;
    error_log /www/wwwlogs/careeraltas.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
